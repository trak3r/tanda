<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tanda Ventures, LLC</title>
  <meta name="description" content="Tanda Ventures, LLC is a Florida limited liability company based in Weston, Florida.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23222'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f1f1f;
      --muted: #6b6b6b;
      --rule: #e2e2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --rule: #2c2c2c;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 30rem;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .entity {
      margin: 0;
      color: var(--muted);
    }
    hr {
      border: 0;
      border-top: 1px solid var(--rule);
      margin: 1.75rem 0;
    }
    p { margin: 0 0 1rem; }
    dl {
      margin: 0;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.5rem 1.5rem;
    }
    dt { color: var(--muted); }
    dd { margin: 0; }
    a { color: inherit; text-underline-offset: 0.2em; }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Tanda Ventures, LLC</h1>
      <p class="entity">A Florida limited liability company.</p>
      <hr>
      <p>Private investment partnership. We do not offer services or accept outside capital.</p>
      <dl>
        <dt>Location</dt>
        <dd>Weston, Florida</dd>
        <dt>Contact</dt>
        <dd><a href="mailto:tandavision@gmail.com">tandavision@gmail.com</a></dd>
      </dl>
    </div>
  </main>
  <footer>&copy; 2026 Tanda Ventures, LLC</footer>
</body>
</html>
